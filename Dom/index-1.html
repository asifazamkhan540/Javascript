<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Dom</title>

    <style>
      .description{
        border: 2px solid red;
        width: 500px;
        color: white;
        background: #000;

      }
    </style>
</head>

<body>


  <h1 id="main-title">Shopping List</h1>

  <div class="container">
   
    <p class="description ">Select the items you want to buy today.</p>
    

    <ul id="grocery-list">
      <li class="item produce">Apples</li>
      <li class="item produce">Bananas</li>
      <li class="item dairy">Milk</li>
      <li class="item dairy">Cheese</li>
    </ul>

    <form id="user-form">
     
      <label>
        <input type="checkbox" name="category" value="fruits"> Fruits
      </label>
      <label>
        <input type="checkbox" name="category" value="dairy"> Dairy
      </label>
    </form>
  </div>



    <script src="index.js"></script>
</body>

</html>
